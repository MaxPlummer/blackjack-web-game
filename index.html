<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="images/favicon-32x32.png"
    />
    <!-- Google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;700&family=Bellefair&family=Barlow:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="index.css" />
    <title>Frontend Mentor | Space tourism website</title>
    <script src="index.js" defer></script>
  </head>
  <body>
    <main class="game-container flow">
      <header>
        <h1 class="header">Blackjack!</h1>
      </header>
      <p id="dealer-cards" hidden>Dealer Cards:</p>
      <p id="player-cards" hidden>Player Cards:</p>
      <button id="play-btn" class="btn play-btn">Play Game</button>
      <button class="btn hit-btn" hidden>Hit</button>
    </main>
  </body>
</html>
